<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="cm-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A0D0E" />
      <stop offset="50%" stop-color="#12090A" />
      <stop offset="100%" stop-color="#090506" />
    </linearGradient>
    <radialGradient id="cm-glow" cx="256" cy="256" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EA2A33" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#EA2A33" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cm-border" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#EA2A33" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="cm-crimson" x1="114" y1="114" x2="380" y2="398" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5A62" />
      <stop offset="45%" stop-color="#EA2A33" />
      <stop offset="100%" stop-color="#9F1219" />
    </linearGradient>
    <linearGradient id="cm-play" x1="220" y1="190" x2="335" y2="322" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3E8E8" />
    </linearGradient>
  </defs>

  <!-- Minimalist Dark Cinema Tile -->
  <rect width="512" height="512" rx="112" fill="url(#cm-bg)" />
  <rect width="512" height="512" rx="112" fill="url(#cm-glow)" />
  <rect x="6" y="6" width="500" height="500" rx="106" stroke="url(#cm-border)" stroke-width="4" />

  <!-- Outer Minimalist "C" Aperture Ring -->
  <path
    d="M 361.5 161 A 142 142 0 1 0 361.5 351"
    stroke="url(#cm-crimson)"
    stroke-width="44"
    stroke-linecap="round"
  />

  <!-- Subtle Inner Lens Reflection Arc -->
  <path
    d="M 188 188 A 96 96 0 0 0 188 324"
    stroke="#FFFFFF"
    stroke-opacity="0.16"
    stroke-width="10"
    stroke-linecap="round"
  />

  <!-- Crisp Rounded Play Prism -->
  <path
    d="M 236 202 L 324 256 L 236 310 Z"
    fill="url(#cm-play)"
    stroke="url(#cm-play)"
    stroke-width="24"
    stroke-linejoin="round"
  />

  <!-- Minimalist Focus Dot -->
  <circle cx="394" cy="256" r="16" fill="#EA2A33" />
</svg>
