<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <link rel="manifest" href="manifest.json?v=20">
    <meta name="theme-color" content="#12090A">
    <link rel="shortcut icon" href="favicon.ico?v=20">
    <link rel="icon" type="image/svg+xml" href="icons/logo.svg?v=20">
    <link rel="apple-touch-icon" href="icons/icon-192.png?v=20">
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400..700,0..1,0" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#ea2a33", "background-light": "#f8f6f6", "background-dark": "#211111" },
                    fontFamily: { "display": ["Spline Sans"] },
                },
            },
        }
    </script>
    <title>Watchlist - CineMatch</title>
    <style>
        body { height: 100dvh; overflow: hidden; overscroll-behavior: none; }
        [x-cloak] { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .material-symbols-outlined.filled { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .material-symbols-outlined.thick { font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200" x-data="watchlistPage">
<div class="flex h-screen flex-col">
   <header class="flex-shrink-0 bg-background-light dark:bg-background-dark z-20 relative shadow-sm">
    <div class="flex items-center justify-between p-4 pb-0">
        <div class="flex items-center gap-2.5">
            <img src="icons/logo.svg?v=20" alt="CineMatch" class="h-7 w-7 rounded-lg shadow-sm object-contain">
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">My List</h1>
        </div>
        <a href="profile.html" class="flex items-center gap-3 p-1 rounded-full hover:bg-gray-200 dark:hover:bg-white/10 transition-colors">
            <img id="header-flag" src="https://flagcdn.com/w40/fr.png" alt="FR" class="w-5 h-auto rounded-sm shadow-sm object-cover">
            <span class="material-symbols-outlined text-3xl text-gray-600 dark:text-gray-300">account_circle</span>
        </a>
    </div>
    <div class="px-4 mt-3">
        <div class="flex items-end justify-between border-b border-gray-200 dark:border-gray-800">
            <div class="relative flex flex-1 mr-4">
                <div class="absolute bottom-0 h-0.5 bg-primary transition-all duration-300 ease-out w-1/2" :style="subTab === 'movie' ? 'left: 0%' : 'left: 50%'"></div>
                <button @click="subTab = 'movie'" class="flex-1 py-3 text-center text-sm font-bold uppercase tracking-wide transition-colors" :class="subTab === 'movie' ? 'text-primary' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'">Films</button>
                <button @click="subTab = 'tv'" class="flex-1 py-3 text-center text-sm font-bold uppercase tracking-wide transition-colors" :class="subTab === 'tv' ? 'text-primary' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'">Séries</button>
            </div>
            <div class="pb-2">
                <div class="relative flex w-32 items-center bg-gray-200 dark:bg-gray-800 rounded-full p-1 h-7 cursor-pointer shadow-inner">
                    <div class="absolute inset-y-1 w-[calc(50%-4px)] bg-white dark:bg-gray-600 rounded-full shadow-sm transition-all duration-300 ease-out" :class="watchStatusFilter === 'watched' ? 'translate-x-[100%] left-1' : 'translate-x-0 left-1'"></div>
                    <button @click="watchStatusFilter = 'unwatched'" class="relative z-10 flex-1 text-[10px] font-bold uppercase text-center h-full flex items-center justify-center transition-colors" :class="watchStatusFilter === 'unwatched' ? 'text-gray-900 dark:text-white' : 'text-gray-500 dark:text-gray-400'">Watchlist</button>
                    <button @click="watchStatusFilter = 'watched'" class="relative z-10 flex-1 text-[10px] font-bold uppercase text-center h-full flex items-center justify-center transition-colors" :class="watchStatusFilter === 'watched' ? 'text-gray-900 dark:text-white' : 'text-gray-500 dark:text-gray-400'">Vu</button>
                </div>
            </div>
        </div>
    </div>
    <div class="flex items-center justify-between px-4 py-3 gap-2">
        <div class="flex-shrink-0">
            <button @click="showServiceBar = !showServiceBar" class="flex items-center group">
            <div class="flex -space-x-3 transition-all duration-200" :class="showServiceBar ? 'opacity-50' : 'opacity-100'">
                <template x-for="(platform, index) in userSelectedPlatforms.slice(0, 4)" :key="platform.id">
                        <img :src="platform.logoUrl" class="w-9 h-9 rounded-full border-2 border-background-light dark:border-background-dark bg-gray-800 object-cover relative" :style="'z-index: ' + (30 - index * 10)">
                    </template>
                <div x-show="userSelectedPlatforms.length > 4" class="w-9 h-9 rounded-full border-2 border-background-light dark:border-background-dark bg-gray-700 flex items-center justify-center text-[10px] text-white font-bold relative z-0">+<span x-text="userSelectedPlatforms.length - 4"></span></div>
                    <div x-show="userSelectedPlatforms.length === 0" class="w-9 h-9 rounded-full border-2 border-background-light dark:border-background-dark bg-gray-800 flex items-center justify-center text-gray-400"><span class="material-symbols-outlined text-sm">add</span></div>
                </div>
                <span class="material-symbols-outlined text-gray-400 text-xl ml-1 transition-transform duration-200" :class="showServiceBar ? 'rotate-180 text-primary' : ''">expand_more</span>
            </button>
        </div>
        <div class="flex items-center gap-1.5 flex-shrink-0">
            <button @click="openPitchMe()" title="Pitch-moi un programme pour ce soir" class="flex items-center gap-1 rounded-full bg-gradient-to-r from-primary/20 to-amber-500/20 border border-primary/40 text-primary hover:from-primary hover:to-amber-500 hover:text-white p-2 px-3 text-xs font-bold shadow-sm transition-all active:scale-95">
                <span class="material-symbols-outlined text-base filled">auto_awesome</span>
                <span>Pitch Me</span>
            </button>
            <div class="relative" x-data="{ open: false }">
                <button @click="open = !open" class="flex items-center space-x-1 rounded-full bg-gray-200 dark:bg-gray-800 p-2 px-3 text-xs text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors">
                    <span class="material-symbols-outlined text-base">swap_vert</span>
                    <span x-text="sortLabel"></span>
                </button>
                <div x-show="open" @click.away="open = false" class="absolute right-0 top-full mt-2 w-48 bg-gray-800 rounded-xl shadow-xl z-50 border border-gray-700 py-2" x-transition x-cloak>
                    <a href="#" @click.prevent="setSort('popularity'); open = false" class="block px-4 py-3 text-sm text-gray-300 hover:bg-gray-700 hover:text-white border-b border-gray-700/50">Popularité</a>
                    <a href="#" @click.prevent="setSort('release_date'); open = false" class="block px-4 py-3 text-sm text-gray-300 hover:bg-gray-700 hover:text-white border-b border-gray-700/50">Date de sortie</a>
                    <a href="#" @click.prevent="setSort('recently_added'); open = false" class="block px-4 py-3 text-sm text-gray-300 hover:bg-gray-700 hover:text-white">Date d'ajout</a>
                </div>
            </div>
            <button @click="showFilterModal = !showFilterModal" class="relative flex items-center space-x-1 rounded-full p-2 px-3 text-xs font-medium transition-colors" :class="hasActiveExtraFilters || showFilterModal ? 'bg-primary text-white' : 'bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'">
                <span class="material-symbols-outlined text-base">filter_list</span>
                <span>Filtrer</span>
            </button>
        </div>
    </div>
    <div x-show="showServiceBar" x-transition class="bg-gray-50 dark:bg-[#151515] border-b border-gray-200 dark:border-gray-800 py-3 px-4 flex flex-wrap w-full items-center gap-3 shadow-inner" x-cloak>
        <a href="platforms.html" class="flex-shrink-0 flex items-center justify-center w-10 h-10 rounded-xl bg-gray-200 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 text-gray-500 hover:text-primary hover:border-primary transition-all"><span class="material-symbols-outlined text-lg">edit</span></a>
        <div class="w-px h-6 bg-gray-300 dark:bg-gray-700 flex-shrink-0 mx-1"></div>
        <button @click="togglePlatformFilter('all')" class="flex-shrink-0 w-10 h-10 rounded-xl transition-all duration-200 border flex items-center justify-center font-bold text-xs" :class="activePlatformFilters.length === 0 ? 'bg-primary text-white border-primary shadow-md scale-105' : 'bg-gray-200 dark:bg-gray-800 text-gray-500 border-gray-300 dark:border-gray-700 hover:text-primary'">
            TOUT
        </button>
        <div class="w-px h-6 bg-gray-300 dark:bg-gray-700 flex-shrink-0 mx-1"></div>
        <template x-for="platform in userSelectedPlatforms" :key="platform.id">
            <button @click="togglePlatformFilter(platform.id)" class="relative flex-shrink-0 w-10 h-10 rounded-xl transition-all duration-200 overflow-hidden group border border-transparent" :class="activePlatformFilters.includes(platform.id) ? 'opacity-100 scale-105 shadow-md' : 'opacity-50 grayscale hover:opacity-80'">
                <img :src="platform.logoUrl" class="w-full h-full object-cover bg-black">
            </button>
        </template>
    </div>

    <!-- Panneau Filtres Watchlist (Genre, Durée & Avis) -->
    <div x-show="showFilterModal" @click.away="showFilterModal = false" x-transition class="bg-gray-100 dark:bg-[#181818] border-b border-gray-200 dark:border-gray-800 p-4 space-y-4 shadow-lg" x-cloak>
        <div class="flex items-center justify-between">
            <span class="text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Filtres avancés</span>
            <button x-show="hasActiveExtraFilters" @click="resetExtraFilters()" class="text-xs font-semibold text-primary hover:underline">Réinitialiser</button>
        </div>

        <template x-if="watchStatusFilter === 'watched'">
            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-gray-600 dark:text-gray-300">Mon avis</label>
                <div class="flex flex-wrap gap-1.5">
                    <button @click="selectedRatingFilter = ''" class="px-2.5 py-1 rounded-full text-xs font-semibold border transition-colors" :class="!selectedRatingFilter ? 'bg-primary text-white border-primary' : 'bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-transparent'">Tous</button>
                    <button @click="selectedRatingFilter = (selectedRatingFilter === 'love' ? '' : 'love')" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold border transition-colors" :class="selectedRatingFilter === 'love' ? 'bg-pink-500/20 text-pink-400 border-pink-500/50' : 'bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-transparent'"><span class="material-symbols-outlined text-[13px] filled text-pink-500">favorite</span>Adoré</button>
                    <button @click="selectedRatingFilter = (selectedRatingFilter === 'ok' ? '' : 'ok')" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold border transition-colors" :class="selectedRatingFilter === 'ok' ? 'bg-amber-500/20 text-amber-300 border-amber-500/50' : 'bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-transparent'"><span class="material-symbols-outlined text-[13px] filled text-amber-400">thumb_up</span>OK</button>
                    <button @click="selectedRatingFilter = (selectedRatingFilter === 'dislike' ? '' : 'dislike')" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold border transition-colors" :class="selectedRatingFilter === 'dislike' ? 'bg-red-500/20 text-red-400 border-red-500/50' : 'bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-transparent'"><span class="material-symbols-outlined text-[13px] filled text-red-400">thumb_down</span>Pas aimé</button>
                    <button @click="selectedRatingFilter = (selectedRatingFilter === 'unrated' ? '' : 'unrated')" class="px-2.5 py-1 rounded-full text-xs font-semibold border transition-colors" :class="selectedRatingFilter === 'unrated' ? 'bg-primary text-white border-primary' : 'bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-transparent'">Non notés</button>
                </div>
            </div>
        </template>

        <template x-if="subTab === 'movie'">
            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-gray-600 dark:text-gray-300">Durée maximum</label>
                <div class="flex gap-2">
                    <button @click="maxDuration = 0" class="flex-1 py-1.5 rounded-lg text-xs font-semibold border transition-colors" :class="!maxDuration ? 'bg-primary text-white border-primary' : 'bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-transparent'">Toutes</button>
                    <button @click="maxDuration = 95" class="flex-1 py-1.5 rounded-lg text-xs font-semibold border transition-colors" :class="maxDuration === 95 ? 'bg-primary text-white border-primary' : 'bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-transparent'">&lt; 1h35</button>
                    <button @click="maxDuration = 120" class="flex-1 py-1.5 rounded-lg text-xs font-semibold border transition-colors" :class="maxDuration === 120 ? 'bg-primary text-white border-primary' : 'bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-transparent'">&lt; 2h00</button>
                    <button @click="maxDuration = 150" class="flex-1 py-1.5 rounded-lg text-xs font-semibold border transition-colors" :class="maxDuration === 150 ? 'bg-primary text-white border-primary' : 'bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-transparent'">&lt; 2h30</button>
                </div>
            </div>
        </template>

        <div class="space-y-1.5" x-show="availableGenresInWatchlist.length > 0">
            <label class="text-xs font-semibold text-gray-600 dark:text-gray-300">Genre</label>
            <div class="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto no-scrollbar">
                <button @click="selectedGenre = ''" class="px-2.5 py-1 rounded-full text-xs font-medium border transition-colors" :class="!selectedGenre ? 'bg-primary text-white border-primary' : 'bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-transparent'">Tous</button>
                <template x-for="g in availableGenresInWatchlist" :key="g">
                    <button @click="selectedGenre = (selectedGenre === g ? '' : g)" class="px-2.5 py-1 rounded-full text-xs font-medium border transition-colors" :class="selectedGenre === g ? 'bg-primary text-white border-primary' : 'bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-transparent'" x-text="g"></button>
                </template>
            </div>
        </div>
    </div>
</header>
    <main class="flex-1 overflow-y-auto pb-24" x-cloak>
        <!-- Bannière d'aide au choix du soir ("Pitch Me") -->
        <div x-show="watchStatusFilter === 'unwatched' && unwatchedPoolForCurrentTab.length > 1" class="px-4 pt-3 pb-1" x-cloak>
            <div @click="openPitchMe()" class="cursor-pointer rounded-2xl bg-gradient-to-r from-[#1c2536] via-[#1a1f2c] to-[#251e2e] border border-primary/30 p-3.5 flex items-center justify-between gap-3 shadow-md hover:border-primary/60 transition-all active:scale-[0.99]">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="w-10 h-10 rounded-xl bg-primary/20 border border-primary/40 flex items-center justify-center text-primary shrink-0">
                        <span class="material-symbols-outlined text-xl filled">style</span>
                    </div>
                    <div class="min-w-0">
                        <p class="text-xs font-extrabold uppercase tracking-wider text-primary flex items-center gap-1">
                            <span>Indécis ce soir ?</span>
                        </p>
                        <p class="text-xs sm:text-sm font-medium text-gray-200 truncate" x-text="subTab === 'movie' ? 'Laissez-vous pitcher un film de votre liste carte par carte' : 'Laissez-vous pitcher une série de votre liste carte par carte'"></p>
                    </div>
                </div>
                <button type="button" class="shrink-0 px-3.5 py-2 rounded-xl bg-primary text-white text-xs font-bold shadow-sm hover:bg-primary/90 transition-colors flex items-center gap-1">
                    <span x-text="subTab === 'movie' ? 'Pitch-moi un film' : 'Pitch-moi une série'"></span>
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
                </button>
            </div>
        </div>

        <div id="media-list" class="divide-y divide-gray-200/20 dark:divide-gray-700/50"></div>
        <div id="empty-state" class="hidden text-center p-8 flex flex-col items-center justify-center h-full">
            <span class="material-symbols-outlined text-6xl text-gray-700 mb-4">movie_filter</span>
            <p class="text-gray-500 dark:text-gray-400 text-lg font-medium">Aucun résultat.</p>
        </div>
    </main>

    <!-- Modal Deck "Pitch Me" -->
    <div x-show="showPitchModal" class="fixed inset-0 z-50 flex items-center justify-center p-2.5 sm:p-4 bg-black/85 backdrop-blur-md" x-transition.opacity x-cloak>
        <div @click.away="closePitchMe()" class="bg-[#161618] text-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-white/10 flex flex-col max-h-[calc(100dvh-1.25rem)]">
            <!-- En-tête du Deck Pitch Me -->
            <div class="px-3.5 pt-2.5 pb-2 border-b border-white/10 bg-[#121214] shrink-0">
                <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-1.5">
                        <span class="material-symbols-outlined text-primary text-base filled">auto_awesome</span>
                        <span class="text-[11px] font-extrabold uppercase tracking-wider text-white" x-text="subTab === 'movie' ? 'Pitch Me • Film du soir' : 'Pitch Me • Série du soir'"></span>
                        <template x-if="pitchDeck.length > 0">
                            <span class="px-2 py-0.5 rounded-full bg-white/10 text-[10px] font-bold text-gray-300" x-text="(pitchIndex + 1) + ' / ' + pitchDeck.length"></span>
                        </template>
                    </div>
                    <button @click="closePitchMe()" class="w-7 h-7 rounded-full bg-white/5 hover:bg-white/15 flex items-center justify-center text-gray-400 hover:text-white transition-colors">
                        <span class="material-symbols-outlined text-base">close</span>
                    </button>
                </div>

                <!-- Filtres rapides dans le Pitch Deck -->
                <div class="flex items-center gap-1.5 mt-1.5 overflow-x-auto no-scrollbar">
                    <template x-if="myPlatformIds.length > 0">
                        <button @click="togglePitchMyPlatforms()" class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-semibold border transition-all shrink-0" :class="pitchFilterMyPlatforms ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/50' : 'bg-white/5 text-gray-400 border-white/10 hover:text-gray-200'">
                            <span class="material-symbols-outlined text-[12px]" :class="pitchFilterMyPlatforms ? 'filled text-emerald-400' : ''">smart_display</span>
                            <span>Dispo sur mes plateformes</span>
                        </button>
                    </template>
                    <template x-if="subTab === 'movie'">
                        <button @click="togglePitchShort()" class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-semibold border transition-all shrink-0" :class="pitchFilterShort ? 'bg-sky-500/20 text-sky-300 border-sky-500/50' : 'bg-white/5 text-gray-400 border-white/10 hover:text-gray-200'">
                            <span class="material-symbols-outlined text-[12px]">bolt</span>
                            <span>Format court (&lt; 1h55)</span>
                        </button>
                    </template>
                </div>
            </div>

            <!-- État vide si aucun titre ne correspond aux filtres -->
            <template x-if="!currentPitchCard">
                <div class="p-6 text-center flex flex-col items-center justify-center space-y-2.5">
                    <span class="material-symbols-outlined text-4xl text-gray-600">style</span>
                    <p class="text-sm font-bold text-white">Aucune carte disponible avec ces filtres</p>
                    <p class="text-xs text-gray-400 max-w-xs">Désactivez un filtre rapide ou ajoutez des titres à votre liste pour lancer le Pitch Me.</p>
                    <div class="flex gap-2 pt-1">
                        <button x-show="pitchFilterMyPlatforms || pitchFilterShort" @click="pitchFilterMyPlatforms = false; pitchFilterShort = false; buildPitchDeck()" class="px-4 py-2 rounded-xl bg-primary text-white text-xs font-bold">Tout afficher</button>
                        <button @click="closePitchMe()" class="px-4 py-2 rounded-xl bg-white/10 text-gray-300 text-xs font-bold">Fermer</button>
                    </div>
                </div>
            </template>

            <!-- Carte Active du Deck -->
            <template x-if="currentPitchCard">
                <div class="flex-1 overflow-y-auto no-scrollbar flex flex-col transition-all duration-150"
                     :class="pitchCardAnim === 'swipe-left' ? '-translate-x-6 opacity-40' : (pitchCardAnim === 'swipe-right' ? 'translate-x-6 opacity-40' : 'translate-x-0 opacity-100')"
                     @touchstart.passive="handlePitchTouchStart($event)"
                     @touchend.passive="handlePitchTouchEnd($event)">

                    <!-- Visuel Hero / Bande-annonce (compact pour tout voir à l'écran) -->
                    <div class="relative w-full h-36 sm:h-44 bg-black shrink-0 overflow-hidden">
                        <template x-if="!pitchShowTrailer">
                            <div class="w-full h-full relative">
                                <img :src="currentPitchCard.backdropUrl" :alt="currentPitchCard.title" class="w-full h-full object-cover opacity-80">
                                <div class="absolute inset-0 bg-gradient-to-t from-[#161618] via-[#161618]/55 to-black/30"></div>

                                <!-- Bouton Bande-annonce sur le Hero -->
                                <template x-if="currentPitchCard.trailerKey">
                                    <button @click.stop="pitchShowTrailer = true" class="absolute top-2.5 right-2.5 px-2.5 py-1 rounded-full bg-black/75 hover:bg-black/90 border border-white/20 text-white text-[11px] font-bold flex items-center gap-1 backdrop-blur-md shadow-lg transition-transform active:scale-95">
                                        <span class="material-symbols-outlined text-xs text-red-500 filled">play_circle</span>
                                        <span>Bande-annonce</span>
                                    </button>
                                </template>

                                <!-- Infos principales ancrées en bas du Hero -->
                                <div class="absolute bottom-2 left-3 right-3 flex items-end gap-3">
                                    <img :src="currentPitchCard.posterUrl" :alt="currentPitchCard.title" class="w-16 sm:w-20 aspect-[2/3] rounded-lg object-cover shadow-2xl border border-white/15 shrink-0 bg-gray-800">
                                    <div class="min-w-0 flex-1 pb-0.5">
                                        <div class="flex flex-wrap items-center gap-1 mb-0.5">
                                            <template x-for="g in currentPitchCard.genres" :key="g">
                                                <span class="px-1.5 py-0.5 rounded bg-white/15 backdrop-blur-sm text-[9px] font-bold uppercase tracking-wide text-gray-100" x-text="g"></span>
                                            </template>
                                        </div>
                                        <h3 class="text-base sm:text-lg font-extrabold text-white leading-tight line-clamp-1 drop-shadow" x-text="currentPitchCard.title"></h3>
                                        <div class="flex items-center flex-wrap gap-1.5 text-[11px] text-gray-300 mt-0.5 font-medium">
                                            <span x-show="currentPitchCard.year" x-text="currentPitchCard.year"></span>
                                            <span x-show="currentPitchCard.durationLabel" class="before:content-['•'] before:mr-1.5" x-text="currentPitchCard.durationLabel"></span>
                                            <template x-if="currentPitchCard.imdbScore">
                                                <span class="inline-flex items-center gap-0.5 text-yellow-400 font-bold">
                                                    <span class="material-symbols-outlined text-[12px] filled">star</span>
                                                    <span x-text="currentPitchCard.imdbScore"></span>
                                                </span>
                                            </template>
                                            <template x-if="currentPitchCard.rtScore">
                                                <span class="inline-flex items-center gap-0.5 text-gray-100 font-bold">
                                                    <img :src="currentPitchCard.rtIconUrl" alt="RT" class="w-3 h-3 object-contain">
                                                    <span x-text="currentPitchCard.rtScore"></span>
                                                </span>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- Lecteur Bande-annonce intégré -->
                        <template x-if="pitchShowTrailer && currentPitchCard.trailerKey">
                            <div class="w-full h-full relative bg-black">
                                <iframe class="w-full h-full" :src="'https://www.youtube.com/embed/' + currentPitchCard.trailerKey + '?autoplay=1&rel=0'" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
                                <button @click.stop="pitchShowTrailer = false" class="absolute top-2 right-2 px-2 py-0.5 rounded-full bg-black/80 text-white text-[11px] font-bold flex items-center gap-1 border border-white/20">
                                    <span class="material-symbols-outlined text-xs">close</span>
                                    <span>Fermer</span>
                                </button>
                            </div>
                        </template>
                    </div>

                    <!-- Corps du Pitch (compact et sans débordement) -->
                    <div class="p-3 space-y-2">
                        <!-- Disponibilité Plateformes -->
                        <template x-if="currentPitchCard.myPlatforms.length > 0">
                            <div class="flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-xl bg-emerald-500/10 border border-emerald-500/30">
                                <div class="flex items-center gap-1 text-[11px] font-bold text-emerald-300">
                                    <span class="material-symbols-outlined text-sm text-emerald-400 filled">check_circle</span>
                                    <span>Dispo sur vos plateformes</span>
                                </div>
                                <div class="flex items-center gap-1">
                                    <template x-for="plat in currentPitchCard.myPlatforms" :key="plat.id">
                                        <div class="flex items-center gap-1 bg-black/40 px-1.5 py-0.5 rounded border border-white/10">
                                            <img :src="plat.logoUrl" :alt="plat.name" class="w-3.5 h-3.5 rounded-sm object-cover">
                                            <span class="text-[10px] font-semibold text-white" x-text="plat.name"></span>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <template x-if="currentPitchCard.myPlatforms.length === 0 && currentPitchCard.otherPlatforms.length > 0">
                            <div class="flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-xl bg-white/5 border border-white/10">
                                <span class="text-[11px] font-medium text-gray-400">Streaming disponible sur :</span>
                                <div class="flex items-center gap-1">
                                    <template x-for="plat in currentPitchCard.otherPlatforms.slice(0, 3)" :key="plat.name">
                                        <img :src="plat.logoUrl" :alt="plat.name" :title="plat.name" class="w-4 h-4 rounded object-cover">
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- Arguments "Pourquoi le voir ce soir ?" -->
                        <div class="space-y-1" x-show="currentPitchCard.pitchPoints.length > 0">
                            <div class="flex items-center justify-between">
                                <span class="text-[10px] font-extrabold uppercase tracking-wider text-primary">Pourquoi le regarder ce soir ?</span>
                                <span x-show="pitchLoadingDetails" class="material-symbols-outlined text-xs text-gray-500 animate-spin">progress_activity</span>
                            </div>
                            <div class="space-y-1">
                                <template x-for="(pt, idx) in currentPitchCard.pitchPoints" :key="idx">
                                    <div class="flex items-center gap-2 px-2.5 py-1.5 rounded-xl border text-[11px] leading-tight font-medium" :class="pt.badgeClass">
                                        <span class="material-symbols-outlined text-sm shrink-0" :class="pt.iconClass" x-text="pt.icon"></span>
                                        <span class="line-clamp-2" x-text="pt.text"></span>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Accroche (Tagline) + Synopsis (Le Pitch) -->
                        <div class="rounded-xl bg-white/[0.04] border border-white/10 p-2.5 space-y-1">
                            <div class="flex items-center gap-1 text-[10px] font-extrabold uppercase tracking-wider text-gray-400">
                                <span class="material-symbols-outlined text-xs text-amber-400">format_quote</span>
                                <span>Le Pitch</span>
                            </div>
                            <p x-show="currentPitchCard.tagline" class="text-[11px] font-bold italic text-amber-300/95 leading-tight line-clamp-1" x-text="'« ' + currentPitchCard.tagline + ' »'"></p>
                            <p class="text-[11px] sm:text-xs text-gray-200 leading-snug line-clamp-4" x-text="currentPitchCard.overview"></p>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Barre d'actions en bas de la carte (Passer / Regarder) -->
            <template x-if="currentPitchCard">
                <div class="p-2.5 border-t border-white/10 bg-[#121214] flex items-center gap-2 shrink-0">
                    <button @click="pitchPrevCard()" :disabled="pitchIndex === 0" title="Carte précédente" class="w-10 h-10 rounded-xl border border-white/10 bg-white/5 flex items-center justify-center text-gray-300 hover:bg-white/10 disabled:opacity-30 disabled:pointer-events-none transition-all active:scale-95 shrink-0">
                        <span class="material-symbols-outlined text-lg">undo</span>
                    </button>
                    <button @click="pitchNextCard()" class="flex-1 h-10 rounded-xl bg-white/10 hover:bg-white/15 border border-white/10 text-gray-100 text-xs font-bold flex items-center justify-center gap-1 transition-all active:scale-95">
                        <span class="material-symbols-outlined text-base text-gray-400">close</span>
                        <span>Passer</span>
                    </button>
                    <a :href="currentPitchCard.detailUrl" @click="closePitchMe()" class="flex-[1.35] h-10 rounded-xl bg-primary hover:bg-primary/90 text-white text-xs font-extrabold flex items-center justify-center gap-1 shadow-lg shadow-primary/25 transition-all active:scale-95">
                        <span class="material-symbols-outlined text-base filled">play_arrow</span>
                        <span>Je regarde ça !</span>
                    </a>
                </div>
            </template>
        </div>
    </div>

    <footer class="flex-shrink-0 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-md border-t border-gray-200 dark:border-gray-800 z-30 h-20 pb-2">
        <nav class="flex justify-around items-center h-full">
            <a class="flex flex-col items-center justify-center gap-1 text-gray-500 dark:text-gray-400 hover:text-primary transition-colors w-16" href="index.html?tab=home">
                <span class="material-symbols-outlined text-2xl">home</span>
                <span class="text-[10px] font-medium">Accueil</span>
            </a>
            <a class="flex flex-col items-center justify-center gap-1 text-gray-500 dark:text-gray-400 hover:text-primary transition-colors w-16" href="index.html?tab=popular">
                <span class="material-symbols-outlined thick text-2xl">local_fire_department</span>
                <span class="text-[10px] font-medium">Populaire</span>
            </a>
            <a class="flex flex-col items-center justify-center gap-1 text-gray-500 dark:text-gray-400 hover:text-primary transition-colors w-16" href="index.html?tab=search">
                <span class="material-symbols-outlined text-2xl">search</span>
                <span class="text-[10px] font-medium">Recherche</span>
            </a>
            <a class="flex flex-col items-center justify-center gap-1 text-primary transition-colors w-16" href="index.html?tab=watchlist">
                <span class="material-symbols-outlined filled text-2xl">bookmark</span>
                <span class="text-[10px] font-bold">Ma Liste</span>
            </a>
        </nav>
    </footer>
</div>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="js/utils.js"></script>
    <script src="js/offlineManager.js"></script>
<script src="watchlist.js"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));}</script>
<script type="module" src="firebase-config.js"></script>
</body>
</html>
